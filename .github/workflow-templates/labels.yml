# Org workflow template. In any dexpace repo: Actions -> New workflow -> this
# lands under "Workflows created by dexpace". Or copy it in by hand as
# .github/workflows/labels.yml.
#
# Set `profiles` after adding it. That one file is the only per-repo cost of the
# whole label system, paid once.
#
# Profiles by repo:
#
#   the six SDK ports                     common,docs,package,sdk
#   kuri, morphic                         common,docs,package
#   zeus, dexpace-react                   common,package
#   styleguide, morphic-test-assets       common,docs
#   confluence, devhub, dexpace.org,
#     .github, the two doc archetypes     common,docs
#   spaceapi, devhub-api                  common

name: Labels

on:
  push:
    branches: [ $default-branch ]
    paths: ['.github/workflows/labels.yml']
  schedule:
    # Monday reconciliation. NOT decoration: between pushes, a label edited in
    # the web UI stays edited. This is what re-heals it. Without the cron, the
    # YAML is advisory.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the plan, mutate nothing'
        type: boolean
        default: false
      prune:
        description: 'Delete labels absent from the profiles'
        type: boolean
        default: true

permissions:
  issues: write

jobs:
  sync:
    uses: dexpace/.github/.github/workflows/labels.yml@main
    with:
      profiles: common
      # On a scheduled or push run these fall back to the safe steady state.
      # The first run against a repo with real issue history should be a
      # workflow_dispatch with dry_run on and prune off. See labels/README.md.
      #
      # Note the asymmetric form. `x && inputs.prune || true` would be a bug:
      # with prune unchecked it reads `true && false || true` = true, so prune
      # could never be turned off. Negate instead.
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      prune:   ${{ github.event_name != 'workflow_dispatch' || inputs.prune }}
